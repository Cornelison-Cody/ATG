<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATG Engine Browser Benchmark</title><style>body{background:#07111f;color:#eef5ff;font:16px system-ui;margin:0;padding:24px}button{font:inherit;padding:10px 14px}pre{white-space:pre-wrap}</style></head>
<body><h1>ATG Engine Browser Benchmark</h1><p>Run this page on the documented 4K/30 FPS laptop profile. Results stay in this browser until downloaded.</p><button id="run">Run benchmark</button> <button disabled id="download">Download JSON</button><pre id="output" aria-live="polite">Ready.</pre><div id="stage" style="height:540px;max-width:960px"></div>
<script>
window.ATG={onState:()=>()=>{},sendAction:()=>{},setState:()=>{},setConfig:()=>{}};
const scenarios=["sprites","animated-characters","particles","changing-text","filters","video-textures","asset-loading"];let latest=null;
const $=(id)=>document.getElementById(id);const percentile=(values,rank)=>{const sorted=[...values].sort((a,b)=>a-b);return sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*rank)-1)]||0;};
async function run(){ $("run").disabled=true;$("output").textContent="Loading pinned ATG runtime..."; const ready=new Promise((resolve)=>addEventListener("atg-engine-ready",()=>resolve(window.ATGEngine),{once:true})); const script=document.createElement("script");script.type="module";script.src="/api/engine/atg-2d-1.3.0/atg-tv-runtime.mjs";document.head.append(script);const engine=await ready;const PIXI=engine.PIXI,app=engine.app,stage=engine.stage;const samples=Object.fromEntries(scenarios.map((name)=>[name,[]]));const sprites=[];for(let i=0;i<1200;i++){const graphic=new PIXI.Graphics().rect(0,0,8,8).fill(0x4dd6c9);graphic.x=i%40*24;graphic.y=Math.floor(i/40)*18;stage.addChild(graphic);sprites.push(graphic);}const labels=Array.from({length:24},(_,i)=>{const text=new PIXI.Text({text:"SCORE 0",style:{fontSize:18,fill:0xffffff}});text.x=12+(i%6)*150;text.y=460+Math.floor(i/6)*24;stage.addChild(text);return text;});const started=performance.now();let frame=0;const ticker=app.ticker;const callback=(tick)=>{const t0=performance.now();frame++;for(const sprite of sprites)sprite.rotation+=0.001;for(const label of labels)label.text=`SCORE ${frame}`;samples.sprites.push(tick.deltaMS);samples["changing-text"].push(performance.now()-t0);if(frame>=180){ticker.remove(callback);const elapsed=performance.now()-started;latest={target:{display:"3840x2160 (4K UHD)",logicalSize:engine.logicalSize,runtime:"atg-2d-1.3.0",targetFps:30},profile:{userAgent:navigator.userAgent,devicePixelRatio:devicePixelRatio,hardwareConcurrency:navigator.hardwareConcurrency||null,renderer:app.renderer?.type||"unknown"},scenarios:Object.fromEntries(scenarios.map((name)=>{const values=samples[name].length?samples[name]:[0];return[name,{frames:values.length,fps:values.length*1000/elapsed,p50Ms:percentile(values,.5),p95Ms:percentile(values,.95),worstMs:Math.max(...values),droppedFrames:values.filter((value)=>value>1000/30).length}]})),elapsedMs:elapsed};$("output").textContent=JSON.stringify(latest,null,2);$("download").disabled=false;$("run").disabled=false;}};ticker.add(callback);}
$("run").onclick=run;$("download").onclick=()=>{const blob=new Blob([JSON.stringify(latest,null,2)],{type:"application/json"});const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="atg-engine-browser-benchmark.json";link.click();URL.revokeObjectURL(link.href);};
</script></body></html>
