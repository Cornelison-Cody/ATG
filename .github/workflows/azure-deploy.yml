name: Azure Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        uses: azure/cli@v2
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        with:
          inlineScript: |
            location="${AZURE_LOCATION:-westus}"
            az group create \
              --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --location "$location"

      - name: Deploy infrastructure
        id: deploy
        uses: azure/cli@v2
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_MAX_REPLICAS: ${{ vars.AZURE_MAX_REPLICAS }}
          AZURE_MIN_REPLICAS: ${{ vars.AZURE_MIN_REPLICAS }}
          CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE_ID }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}
          AI_WORKER_TOKEN: ${{ secrets.AI_WORKER_TOKEN }}
          ENABLE_LOCAL_COMPANION: ${{ vars.ENABLE_LOCAL_COMPANION }}
          ENABLE_CODEX_SDK_PROTOTYPE: ${{ vars.ENABLE_CODEX_SDK_PROTOTYPE }}
          ATG_COMPANION_TOKEN: ${{ secrets.ATG_COMPANION_TOKEN }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          ENTRA_API_AUDIENCE: ${{ vars.ENTRA_API_AUDIENCE }}
          ENTRA_ALLOWED_APP_IDS: ${{ vars.ENTRA_ALLOWED_APP_IDS }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATG_USER_SETTINGS_ENCRYPTION_KEY: ${{ secrets.ATG_USER_SETTINGS_ENCRYPTION_KEY }}
        with:
          inlineScript: |
            set -euo pipefail
            deployment_name="atg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            location="${AZURE_LOCATION:-westus}"
            environment_name="${AZURE_ENVIRONMENT_NAME:-prod}"
            az deployment group create \
              --name "$deployment_name" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/main.bicep \
              --parameters \
                location="$location" \
                environmentName="$environment_name" \
                containerImage="${{ env.IMAGE_NAME }}:${{ github.sha }}" \
                appBaseUrl="${APP_BASE_URL:-}" \
                customDomainName="${CUSTOM_DOMAIN_NAME:-}" \
                customDomainCertificateId="${CUSTOM_DOMAIN_CERTIFICATE_ID:-}" \
                aiWorkerUrl="${AI_WORKER_URL:-}" \
                enableLocalCompanion="${ENABLE_LOCAL_COMPANION:-false}" \
                enableCodexSdkPrototype="${ENABLE_CODEX_SDK_PROTOTYPE:-false}" \
                aiWorkerToken="${AI_WORKER_TOKEN:-}" \
                atgCompanionToken="${ATG_COMPANION_TOKEN:-}" \
                openAiApiKey="${OPENAI_API_KEY:-}" \
                userSettingsEncryptionKey="${ATG_USER_SETTINGS_ENCRYPTION_KEY:-}" \
                ghcrUsername="${GHCR_USERNAME:-}" \
                ghcrToken="${GHCR_TOKEN:-}" \
                entraTenantId="${ENTRA_TENANT_ID:-}" \
                entraClientId="${ENTRA_CLIENT_ID:-}" \
                entraClientSecret="${ENTRA_CLIENT_SECRET:-}" \
                entraApiAudience="${ENTRA_API_AUDIENCE:-}" \
                entraAllowedAppIds="${ENTRA_ALLOWED_APP_IDS:-}" \
                minReplicas="${AZURE_MIN_REPLICAS:-0}" \
                maxReplicas="${AZURE_MAX_REPLICAS:-1}" \
              --query properties.outputs \
              --output json > deployment-outputs.json
            app_url="$(jq -r '.appUrl.value' deployment-outputs.json)"
            container_app_name="$(jq -r '.containerAppName.value' deployment-outputs.json)"
            echo "app_url=$app_url" >> "$GITHUB_OUTPUT"
            echo "container_app_name=$container_app_name" >> "$GITHUB_OUTPUT"
            echo "Deployed ATG to $app_url"

      - name: Set generated app base URL
        if: ${{ vars.APP_BASE_URL == '' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ steps.deploy.outputs.container_app_name }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --set-env-vars APP_BASE_URL="${{ steps.deploy.outputs.app_url }}"

      - name: Health check
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "${{ steps.deploy.outputs.app_url }}/api/health"; then
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed for ${{ steps.deploy.outputs.app_url }}/api/health"
          exit 1

      - name: Authenticated API smoke test
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          ATG_TEST_CLIENT_ID: ${{ vars.ATG_TEST_CLIENT_ID }}
          ATG_TEST_CLIENT_SECRET: ${{ secrets.ATG_TEST_CLIENT_SECRET }}
          ATG_TEST_SCOPE: ${{ vars.ATG_TEST_SCOPE }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          FALLBACK_APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          set -euo pipefail
          if [ -z "${ATG_TEST_CLIENT_ID:-}" ] || [ -z "${ATG_TEST_CLIENT_SECRET:-}" ] || [ -z "${ATG_TEST_SCOPE:-}" ]; then
            echo "Skipping authenticated API smoke test because ATG test service principal is not configured."
            exit 0
          fi

          token_response="$(curl --fail --silent --show-error \
            --request POST "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${ATG_TEST_CLIENT_ID}" \
            --data-urlencode "client_secret=${ATG_TEST_CLIENT_SECRET}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=${ATG_TEST_SCOPE}")"
          access_token="$(node -e 'const response = JSON.parse(process.argv[1]); process.stdout.write(response.access_token || "");' "$token_response")"
          if [ -z "$access_token" ]; then
            echo "Service principal token response did not include an access token."
            exit 1
          fi

          urls=("$FALLBACK_APP_URL")
          if [ -n "${APP_BASE_URL:-}" ] && [ "$APP_BASE_URL" != "$FALLBACK_APP_URL" ]; then
            urls+=("$APP_BASE_URL")
          fi

          for base_url in "${urls[@]}"; do
            for attempt in {1..10}; do
              if curl --fail --silent --show-error \
                --header "Authorization: Bearer ${access_token}" \
                "${base_url}/api/projects" >/dev/null; then
                echo "Authenticated API smoke test passed for ${base_url}."
                exit 0
              fi
              sleep 10
            done
          done

          echo "Authenticated API smoke test failed for all configured app URLs."
          exit 1
